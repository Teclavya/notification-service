spring:
  application:
    name: notification-service
  profiles:
    active: ${APP_PROFILE:dev}
  # RabbitMQ event bus for SLA monitoring and lifecycle events
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:true}
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms
  # SMTP config — all values from env; absent in dev (log-only mode)
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# JWT secret used by JwtUtil for verifying inbound tokens.
# application-dev.yaml and application-test.yaml override this in those profiles with their
# own non-prod values. JWT_SECRET is REQUIRED here (no hardcoded fallback) — JwtUtil's
# @PostConstruct SecretGuard check fails the service at startup if it is unset, blank,
# a placeholder, too short, or the known-compromised fleet-wide dev-default hex key.
application:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

# Internal service-to-service token (cohorts-latest → notification-service)
internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:}

# Learning-journey ethical send-gate poller (NS-BE-4a, design.md §10, ADR-8/ADR-10).
# Default false — ship dark; OFF means the endpoint still accepts+enqueues /send-gated
# requests (rows sit at DRAFTED) but the poller never verifies/approves/sends (AC-10.2).
feature:
  flags:
    lifecycle:
      send-gate:
        enabled: ${FF_LIFECYCLE_SEND_GATE_ENABLED:false}
    email:
      suppression-enabled: ${FF_EMAIL_SUPPRESSION_ENABLED:true}
      bounce-webhook-enabled: ${FF_EMAIL_BOUNCE_WEBHOOK_ENABLED:true}

# Webhook configuration for external callbacks (bounce / delivery notifications)
notification:
  webhook:
    secret: ${NOTIFICATION_WEBHOOK_SECRET:dev-webhook-secret}
  oncall:
    enabled: ${NOTIFICATION_ONCALL_ENABLED:true}
    slack-webhook-url: ${NOTIFICATION_ONCALL_SLACK_WEBHOOK_URL:}
    discord-webhook-url: ${NOTIFICATION_ONCALL_DISCORD_WEBHOOK_URL:}
    admin-alert-email: ${NOTIFICATION_ONCALL_ADMIN_ALERT_EMAIL:oncall-alerts@teclavya.com}
    email-alerts-enabled: ${NOTIFICATION_ONCALL_EMAIL_ALERTS_ENABLED:true}

# Resilience4j — content-safety verifier circuit-breaker + time-limiter (BE-3)
resilience4j:
  circuitbreaker:
    instances:
      contentSafetyVerifier:
        registerHealthIndicator: false
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      contentSafetyVerifier:
        timeoutDuration: 4s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
