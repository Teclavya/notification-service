name: Deploy Notification Service

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        required: true
        type: choice
        options:
          - release
          - development
        default: 'release'
      custom_branch:
        description: 'Or enter a custom feature branch name (overrides above)'
        required: false
        type: string
        default: ''

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment permission
        run: |
          ALLOWED_USERS="kasi-tech srinibash-sai surya-gorla meruvak Gopikrishnan200"
          ACTOR="${{ github.actor }}"
          if echo "$ALLOWED_USERS" | grep -qw "$ACTOR"; then
            echo "Authorized: $ACTOR"
          else
            echo "::error::Deployment denied. User '$ACTOR' is not authorized to deploy."
            echo "Allowed users: $ALLOWED_USERS"
            exit 1
          fi

  resolve-branch:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      deploy_branch: ${{ steps.resolve.outputs.deploy_branch }}
      needs_merge: ${{ steps.resolve.outputs.needs_merge }}
    steps:
      - name: Resolve deploy branch
        id: resolve
        run: |
          CUSTOM="${{ inputs.custom_branch }}"
          SELECTED="${{ inputs.branch }}"
          if [ -n "$CUSTOM" ]; then
            echo "deploy_branch=$CUSTOM" >> "$GITHUB_OUTPUT"
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
            echo "Using custom branch: $CUSTOM"
          elif [ "$SELECTED" = "development" ]; then
            echo "deploy_branch=release" >> "$GITHUB_OUTPUT"
            echo "needs_merge=true" >> "$GITHUB_OUTPUT"
            echo "Development selected — will merge to release first"
          else
            echo "deploy_branch=release" >> "$GITHUB_OUTPUT"
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
            echo "Deploying from release"
          fi

  merge-to-release:
    needs: resolve-branch
    if: needs.resolve-branch.outputs.needs_merge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_PAT }}

      - name: Merge development into release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin development
          git merge origin/development --no-edit
          git push origin release

  build-and-validate:
    needs: [resolve-branch, merge-to-release]
    if: always() && (needs.merge-to-release.result == 'success' || needs.merge-to-release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-branch.outputs.deploy_branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and validate
        run: mvn clean package -DskipTests -q

  deploy:
    needs: [resolve-branch, build-and-validate]
    if: always() && needs.build-and-validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        run: |
          BRANCH="${{ needs.resolve-branch.outputs.deploy_branch }}"
          echo "Deploying notification-service from branch '$BRANCH' to test"
          gh workflow run deploy-service.yml \
            --repo Teclavya/teclavya \
            -f service=notification-service \
            -f environment=test \
            -f branch="$BRANCH"
          echo "Deployment triggered! Monitor: https://github.com/Teclavya/teclavya/actions/workflows/deploy-service.yml"
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PAT }}

      - name: Deployment summary
        if: always()
        run: |
          sleep 10
          RUN_ID=$(gh run list --repo Teclavya/teclavya --workflow deploy-service.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | \`notification-service\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ needs.resolve-branch.outputs.deploy_branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`test\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Merged dev→release | \`${{ needs.resolve-branch.outputs.needs_merge }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy Run | [#${RUN_ID}](https://github.com/Teclavya/teclavya/actions/runs/${RUN_ID}) |" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
