spring:
  application:
    name: notification-service
  profiles:
    active: ${APP_PROFILE:dev}
  # SMTP config — all values from env; absent in dev (log-only mode)
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# JWT secret used by JwtUtil for verifying inbound tokens.
# application-dev.yaml and application-test.yaml override this in those profiles.
# In prod / any profile without an override, fall back to the same dev-default
# hex key used by the rest of the platform so the service still starts;
# production deploys MUST override JWT_SECRET via env var.
application:
  jwt:
    secret: ${JWT_SECRET:4D6251655468576D5A7134743777217A25432A462D4A614E645267556B587032}
    expiration: 86400000

# Internal service-to-service token (cohorts-latest → notification-service)
internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:}
