server:
  port: ${SERVER_PORT:9016}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teclavya_notifications}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Kurichedu12345!}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  data:
    redis:
      host: ${REDIS_HOST:redis-19481.c258.us-east-1-4.ec2.cloud.redislabs.com}
      port: ${REDIS_PORT:19481}
      password: ${REDIS_PASSWORD:GW5JBtzWFAww8Mh99vswE7F7kGbvSXs5}
      ssl:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Resilience4j — content-safety verifier (dev: relaxed thresholds, same 4 s timeout)
resilience4j:
  circuitbreaker:
    instances:
      contentSafetyVerifier:
        registerHealthIndicator: false
        slidingWindowSize: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      contentSafetyVerifier:
        timeoutDuration: 4s
        cancelRunningFuture: true

application:
  cors: http://127.0.0.1:3000, http://localhost:3000
  jwt:
    # Dev-only secret (distinct from the retired, leaked fleet-wide default). SecretGuard
    # (JwtUtil#validateSecret) still validates this at startup. Override via JWT_SECRET for any
    # real environment.
    secret: ${JWT_SECRET:syrWS9vYggk3iabR7psfJYK3g5KINknA/4EgHkH3pAA=}
    expiration: 86400000
  notification:
    max-push-per-day: 3
    max-email-per-day: 1
    quiet-hours-start: 22
    quiet-hours-end: 7

notification:
  email:
    force-log-only: true
