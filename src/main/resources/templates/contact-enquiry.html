<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Teclavya Contact Enquiry</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a; line-height: 1.5; padding: 24px;">
  <div style="max-width: 640px; margin: 0 auto; border: 1px solid #e2e8f0; border-radius: 10px; padding: 24px;">
    <h2 style="margin-top: 0; color: #0284c7;">New Public Enquiry ({referenceId})</h2>
    <p><strong>Topic:</strong> {topicLabel} ({targetAlias})</p>
    <p><strong>From:</strong> {senderName} &lt;{senderEmail}&gt;</p>
    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 16px 0;" />
    <p style="white-space: pre-wrap;">{messageBody}</p>
    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 16px 0;" />
    <p style="font-size: 12px; color: #64748b;">Sent via Teclavya Contact Us (no-reply@teclavya.com). Reply directly to respond to {senderEmail}.</p>
  </div>
</body>
</html>
