spring:
  application:
    name: notification-service
  profiles:
    active: ${APP_PROFILE:dev}
  # SMTP config — all values from env; absent in dev (log-only mode)
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# JWT secret used by JwtUtil for verifying inbound tokens.
# application-dev.yaml and application-test.yaml override this in those profiles with their
# own non-prod values. JWT_SECRET is REQUIRED here (no hardcoded fallback) — JwtUtil's
# @PostConstruct SecretGuard check fails the service at startup if it is unset, blank,
# a placeholder, too short, or the known-compromised fleet-wide dev-default hex key.
application:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

# Internal service-to-service token (cohorts-latest → notification-service)
internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:}

# Resilience4j — content-safety verifier circuit-breaker + time-limiter (BE-3)
resilience4j:
  circuitbreaker:
    instances:
      contentSafetyVerifier:
        registerHealthIndicator: false
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      contentSafetyVerifier:
        timeoutDuration: 4s
        cancelRunningFuture: true
