server:
  port: ${SERVER_PORT:9016}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teclavya_notifications}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Kurichedu12345!}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

application:
  cors: http://127.0.0.1:3000, http://localhost:3000
  jwt:
    secret: 4D6251655468576D5A7134743777217A25432A462D4A614E645267556B587032
    expiration: 86400000
  notification:
    max-push-per-day: 3
    max-email-per-day: 1
    quiet-hours-start: 22
    quiet-hours-end: 7
